<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Betania — Debug Logs</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0 }
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      padding: 8px 16px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }
    header h1 { font-size: 14px; font-weight: 600; color: #58a6ff }
    .badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 20px;
      background: #21262d;
      color: #8b949e;
    }
    .badge.connected { background: #0d2e1c; color: #3fb950 }
    .badge.disconnected { background: #2e0f0f; color: #f85149 }
    .controls {
      margin-left: auto;
      display: flex;
      gap: 8px;
    }
    .btn {
      padding: 3px 10px;
      border-radius: 4px;
      border: 1px solid #30363d;
      background: #21262d;
      color: #8b949e;
      cursor: pointer;
      font-size: 11px;
    }
    .btn:hover { background: #30363d; color: #e6edf3 }
    .panels {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-right: 1px solid #30363d;
    }
    .panel:last-child { border-right: none }
    .panel-header {
      padding: 6px 12px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      font-weight: 600;
      font-size: 11px;
      color: #8b949e;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .panel-header span { color: #e6edf3 }
    .log-count {
      margin-left: auto;
      font-size: 10px;
      color: #484f58;
    }
    .log-area {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
    }
    .log-entry {
      display: flex;
      padding: 2px 12px;
      gap: 8px;
      line-height: 1.6;
      border-bottom: 1px solid transparent;
    }
    .log-entry:hover { background: #161b22 }
    .log-ts {
      color: #484f58;
      flex-shrink: 0;
      width: 85px;
    }
    .log-level {
      flex-shrink: 0;
      width: 40px;
      font-weight: 600;
    }
    .log-tag {
      flex-shrink: 0;
      width: 36px;
      color: #8b949e;
    }
    .log-msg { color: #e6edf3; flex: 1; word-break: break-all }
    .log-data {
      color: #8b949e;
      flex: 1.5;
      white-space: pre-wrap;
      word-break: break-all;
      border-left: 2px solid #21262d;
      padding-left: 8px;
    }
    /* Level colors */
    .level-info  .log-level { color: #58a6ff }
    .level-warn  .log-level { color: #d29922 }
    .level-error .log-level { color: #f85149 }
    .level-debug .log-level { color: #484f58 }
    .level-error { background: #160b0b }
    .level-warn  { background: #1a1200 }

    /* AI-specific highlight */
    .tag-ai .log-tag { color: #bc8cff }
    .tag-ai.has-data .log-data { border-color: #3d1f6e }

    /* HTTP-specific */
    .tag-http .log-tag { color: #39d353 }

    .empty-state {
      padding: 40px;
      text-align: center;
      color: #484f58;
    }

    /* Filter bar */
    .filter-row {
      display: flex;
      gap: 4px;
      padding: 4px 12px;
      background: #0d1117;
      border-bottom: 1px solid #21262d;
      flex-shrink: 0;
    }
    .filter-btn {
      padding: 2px 8px;
      border-radius: 3px;
      border: 1px solid #21262d;
      background: transparent;
      color: #484f58;
      cursor: pointer;
      font-size: 10px;
    }
    .filter-btn.active { border-color: #58a6ff; color: #58a6ff; background: #0d2140 }
    .filter-btn.ai-active { border-color: #bc8cff; color: #bc8cff; background: #1e1040 }
    .filter-btn.http-active { border-color: #39d353; color: #39d353; background: #0d2e1c }
  </style>
</head>
<body>
<header>
  <h1>✦ Betania Debug Logs</h1>
  <span id="status" class="badge disconnected">Desconectado</span>
  <div class="controls">
    <button class="btn" onclick="clearLogs()">Limpiar</button>
    <button class="btn" id="pauseBtn" onclick="togglePause()">Pausar</button>
    <button class="btn" onclick="scrollToBottom()">↓ Fin</button>
  </div>
</header>
<div class="panels">
  <!-- Panel AI -->
  <div class="panel">
    <div class="panel-header">
      <span>🤖 Agente IA</span>
      <span style="color:#bc8cff;font-size:10px">tool calls · iteraciones · respuestas</span>
      <span class="log-count" id="ai-count">0 entradas</span>
    </div>
    <div class="filter-row">
      <button class="filter-btn active" id="ai-filter-all"    onclick="setFilter('ai','all')">Todo</button>
      <button class="filter-btn"        id="ai-filter-call"   onclick="setFilter('ai','call')">Tool calls</button>
      <button class="filter-btn"        id="ai-filter-result" onclick="setFilter('ai','result')">Resultados</button>
      <button class="filter-btn"        id="ai-filter-error"  onclick="setFilter('ai','error')">Errores</button>
    </div>
    <div class="log-area" id="ai-logs"></div>
  </div>

  <!-- Panel HTTP -->
  <div class="panel">
    <div class="panel-header">
      <span>🌐 HTTP Backend</span>
      <span style="color:#39d353;font-size:10px">requests · responses</span>
      <span class="log-count" id="http-count">0 entradas</span>
    </div>
    <div class="filter-row">
      <button class="filter-btn active" id="http-filter-all"  onclick="setFilter('http','all')">Todo</button>
      <button class="filter-btn"        id="http-filter-api"  onclick="setFilter('http','api')">Solo /api</button>
      <button class="filter-btn"        id="http-filter-ai"   onclick="setFilter('http','ai-only')">Solo /ai</button>
    </div>
    <div class="log-area" id="http-logs"></div>
  </div>
</div>

<script>
  let paused    = false
  let aiFilter  = 'all'
  let httpFilter= 'all'
  let aiCount   = 0
  let httpCount = 0

  const source = new EventSource('/api/ai/logs')

  source.onopen = () => {
    document.getElementById('status').textContent = 'Conectado'
    document.getElementById('status').className   = 'badge connected'
  }
  source.onerror = () => {
    document.getElementById('status').textContent = 'Desconectado'
    document.getElementById('status').className   = 'badge disconnected'
  }

  source.onmessage = (e) => {
    if (paused) return
    const entry = JSON.parse(e.data)
    handleEntry(entry)
  }

  function handleEntry(entry) {
    if (entry.tag === 'AI') {
      appendAI(entry)
    } else if (entry.tag === 'HTTP') {
      appendHTTP(entry)
    }
  }

  function appendAI(entry) {
    const area = document.getElementById('ai-logs')
    const node = buildEntry(entry)

    const msg = entry.msg ?? ''
    node.dataset.type = msg.includes('Tool call:') ? 'call'
                      : msg.includes('Tool result:') ? 'result'
                      : entry.level === 'error' ? 'error'
                      : 'other'

    if (aiFilter !== 'all' && node.dataset.type !== aiFilter) {
      node.style.display = 'none'
    }

    area.appendChild(node)
    aiCount++
    document.getElementById('ai-count').textContent = aiCount + ' entradas'
    scrollAreaToBottom(area)
  }

  function appendHTTP(entry) {
    const area = document.getElementById('http-logs')
    const node = buildEntry(entry)

    const msg = entry.msg ?? ''
    node.dataset.path = msg.includes('/api/ai') ? 'ai-only'
                      : msg.includes('/api')    ? 'api'
                      : 'other'

    if (httpFilter === 'api'     && !['api','ai-only'].includes(node.dataset.path)) node.style.display = 'none'
    if (httpFilter === 'ai-only' && node.dataset.path !== 'ai-only')               node.style.display = 'none'

    area.appendChild(node)
    httpCount++
    document.getElementById('http-count').textContent = httpCount + ' entradas'
    scrollAreaToBottom(area)
  }

  function buildEntry(entry) {
    const div = document.createElement('div')
    div.className = `log-entry level-${entry.level} tag-${entry.tag.toLowerCase()}`
    if (entry.data != null) div.classList.add('has-data')

    const ts      = entry.ts.slice(11, 23)   // HH:MM:SS.mmm
    const dataStr = entry.data != null
      ? (typeof entry.data === 'string' ? entry.data : JSON.stringify(entry.data, null, 2))
      : ''

    div.innerHTML = `
      <span class="log-ts">${escHtml(ts)}</span>
      <span class="log-level">${escHtml(entry.level.toUpperCase().slice(0,3))}</span>
      <span class="log-tag">${escHtml(entry.tag)}</span>
      <span class="log-msg">${escHtml(entry.msg ?? '')}</span>
      ${dataStr ? `<span class="log-data">${escHtml(dataStr)}</span>` : ''}
    `
    return div
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  }

  function scrollAreaToBottom(area) {
    const atBottom = area.scrollTop + area.clientHeight >= area.scrollHeight - 40
    if (atBottom) area.scrollTop = area.scrollHeight
  }

  function scrollToBottom() {
    document.getElementById('ai-logs').scrollTop   = 999999
    document.getElementById('http-logs').scrollTop = 999999
  }

  function clearLogs() {
    document.getElementById('ai-logs').innerHTML   = ''
    document.getElementById('http-logs').innerHTML = ''
    aiCount   = 0
    httpCount = 0
    document.getElementById('ai-count').textContent   = '0 entradas'
    document.getElementById('http-count').textContent = '0 entradas'
  }

  function togglePause() {
    paused = !paused
    document.getElementById('pauseBtn').textContent = paused ? 'Reanudar' : 'Pausar'
    document.getElementById('pauseBtn').style.color = paused ? '#d29922' : ''
  }

  function setFilter(panel, value) {
    if (panel === 'ai') {
      aiFilter = value
      document.querySelectorAll('[id^="ai-filter"]').forEach(b => b.classList.remove('active'))
      document.getElementById(`ai-filter-${value}`).classList.add('active')
      document.querySelectorAll('#ai-logs .log-entry').forEach(node => {
        node.style.display = (value === 'all' || node.dataset.type === value) ? '' : 'none'
      })
    } else {
      httpFilter = value
      document.querySelectorAll('[id^="http-filter"]').forEach(b => b.classList.remove('active'))
      document.getElementById(`http-filter-${value}`).classList.add('active')
      document.querySelectorAll('#http-logs .log-entry').forEach(node => {
        const p = node.dataset.path
        let show = true
        if (value === 'api'     && !['api','ai-only'].includes(p)) show = false
        if (value === 'ai-only' && p !== 'ai-only')                show = false
        node.style.display = show ? '' : 'none'
      })
    }
  }
</script>
</body>
</html>
