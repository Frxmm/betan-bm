# FASE 1: sitio solo por HTTP (sin certificados), para poder pedir el cert.
# nginx reenvía todo a la app Bun (127.0.0.1:3100), que sirve la web y la API.
# Cuando exista el certificado, sustitúyelo por nginx-betanbm.conf (fase 2).
server {
    listen 80;
    listen [::]:80;
    server_name betanbm.com www.betanbm.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 32k;
    }
}
