# nginx para www.betanbm.com (FASE 2: HTTPS). Antes: fase 1 con nginx-betanbm-http.conf.
# Canónico: https://www.betanbm.com  (el apex betanbm.com y HTTP redirigen a él).
# Toda la web y la API las sirve la app Bun en 127.0.0.1:3100 (ver betanbm-web.service);
# nginx se ocupa de TLS, redirecciones y del límite de peticiones al formulario.
#
#   sudo cp nginx-betanbm.conf /etc/nginx/sites-available/betanbm.com
#   sudo nginx -t && sudo systemctl reload nginx

# 6 envíos del formulario por minuto y por IP (la app añade su propio límite por hora)
limit_req_zone $binary_remote_addr zone=betan_contact:10m rate=6r/m;
# resto de la API (docs, admin, analítica): ritmo general por IP
limit_req_zone $binary_remote_addr zone=betan_api:10m rate=5r/s;

# El enlace de la guía lleva el token en la URL: no se escribe en el access_log.
map $request_uri $betan_uri { ~^/docs/ /docs/[token]; default $request_uri; }
log_format betan '$remote_addr - [$time_local] "$request_method $betan_uri" $status $body_bytes_sent "$http_user_agent"';

# HTTP: ACME + redirección a https://www
server {
    listen 80;
    listen [::]:80;
    server_name betanbm.com www.betanbm.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://www.betanbm.com$request_uri;
    }
}

# HTTPS apex -> www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name betanbm.com;

    ssl_certificate     /etc/letsencrypt/live/betanbm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/betanbm.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.betanbm.com$request_uri;
}

# HTTPS sitio
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.betanbm.com;

    ssl_certificate     /etc/letsencrypt/live/betanbm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/betanbm.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 32k;
    server_tokens off;

    # Formulario: límite de ritmo en nginx (la app valida y limita también)
    location = /api/contact {
        limit_req zone=betan_contact burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=betan_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    access_log /var/log/nginx/betanbm.access.log betan;
    error_log  /var/log/nginx/betanbm.error.log;
}
