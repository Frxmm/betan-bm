<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Betan: tu hotel funciona solo. Hasta a las 3 de la mañana.">
  <rect width="1200" height="630" fill="#0f2a43"/>
  <rect x="60" y="60" width="1080" height="510" rx="36" fill="none" stroke="#25435d" stroke-width="2"/>
  <g transform="translate(100 100)">
    <rect width="96" height="96" rx="21" fill="#1f4fd8"/>
    <path d="M30 21h21a15 15 0 0 1 7.5 27.9A16.5 16.5 0 0 1 54 75H30z" fill="none" stroke="#f4c430" stroke-width="9" stroke-linejoin="round"/>
  </g>
  <text x="220" y="170" font-family="Bricolage Grotesque, Helvetica, Arial, sans-serif" font-weight="800" font-size="64" fill="#eaf2f6" letter-spacing="-2">Betan</text>
  <text x="100" y="315" font-family="Bricolage Grotesque, Helvetica, Arial, sans-serif" font-weight="800" font-size="76" fill="#eaf2f6" letter-spacing="-3">Tu hotel funciona solo.</text>
  <text x="100" y="400" font-family="Bricolage Grotesque, Helvetica, Arial, sans-serif" font-weight="800" font-size="76" fill="#eaf2f6" letter-spacing="-3">Hasta a las 3 de la mañana.</text>
  <text x="100" y="480" font-family="Hanken Grotesk, Helvetica, Arial, sans-serif" font-size="30" fill="#b4c3d2">Reserva, cobro, parte de viajeros y código de puerta</text>
  <text x="100" y="520" font-family="Hanken Grotesk, Helvetica, Arial, sans-serif" font-size="30" fill="#b4c3d2">en un solo flujo. PMS con IA para hoteles independientes.</text>
  <g transform="translate(960 110) rotate(5)">
    <rect width="150" height="180" rx="24" fill="#1f4fd8"/>
    <circle cx="75" cy="26" r="11" fill="#0f2a43"/>
    <text x="75" y="118" text-anchor="middle" font-family="Bricolage Grotesque, Helvetica, Arial, sans-serif" font-weight="800" font-size="72" fill="#f4c430" letter-spacing="-3">214</text>
    <text x="75" y="155" text-anchor="middle" font-family="Hanken Grotesk, Helvetica, Arial, sans-serif" font-weight="500" font-size="17" fill="#ffffff">Puerta abierta</text>
  </g>
</svg>
